services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commb_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-commb}
    volumes:
      - commb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commb_user} -d ${POSTGRES_DB:-commb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  commb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${COMMB_PORT:-8422}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-commb_user}:${POSTGRES_PASSWORD:-commb_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-commb}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  commb_pgdata:
