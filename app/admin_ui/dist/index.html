<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommB Admin — Multi-Agent Studio & Business Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/_/admin/style.css" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tailwind CSS -->
  <script>
    // Suppress CDN production notice in console
    const _origWarn = console.warn;
    console.warn = function(...args) {
      if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
      _origWarn.apply(console, args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontSize: {
            xs: ['12px', '16px'],
            sm: ['14px', '20px'],
            base: ['14px', '20px'],
            md: ['16px', '24px'],
            lg: ['18px', '26px'],
            xl: ['20px', '28px'],
            '2xl': ['24px', '32px'],
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            // Reads from CSS vars (not a flat hex) since brand flips from
            // near-black in light mode to near-white in dark mode — a
            // static value would go invisible against a dark sidebar/modal.
            brand: 'var(--brand)',
            brandHover: 'var(--brand-hover)',
            'brand-contrast': 'var(--brand-contrast)',
            app: 'var(--bg-app)',
            surface: 'var(--bg-surface)',
            'surface-elevated': 'var(--bg-surface-elevated)',
            'surface-hover': 'var(--bg-surface-hover)',
            sidebar: 'var(--bg-sidebar)',
            subtle: 'var(--border-subtle)',
            faint: 'var(--text-subtle)',
            main: 'var(--text-main)',
            muted: 'var(--text-muted)',
            // Status colors — kept distinct from brand, since these convey
            // state (success/error/warning/info) not identity. Each is a
            // full numbered shade scale (DEFAULT = the original flat value,
            // so existing bg-emerald/text-rose/etc. usages keep working
            // unchanged) rather than a single flat hex — a flat value here
            // silently breaks EVERY existing emerald-500/rose-600/etc.
            // usage elsewhere in the app (Tailwind can no longer resolve
            // the shade suffix at all, so the utility generates no color
            // rule — text/backgrounds quietly fall back to inherited grey
            // instead of erroring, which is how this went unnoticed).
            emerald: {
              DEFAULT: '#008060', 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
              400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b',
            },
            rose: {
              DEFAULT: '#d72c0d', 50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af',
              400: '#fb7185', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c', 800: '#9f1239', 900: '#881337',
            },
            amber: {
              DEFAULT: '#b45309', 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d',
              400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e', 900: '#78350f',
            },
            sky: {
              DEFAULT: '#0369a1', 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
              400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e',
            },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-app text-main font-sans antialiased selection:bg-brand selection:text-brand-contrast">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- App rendered dynamically by app.js -->
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div id="modal-root"></div>

  <script type="module" src="/_/admin/js/main.js"></script>
</body>
</html>
