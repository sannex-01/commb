services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commb_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-commb_dev}
    ports:
      # Exposed on the host too, in case you want to inspect it directly
      # with psql or a GUI client during development.
      - "5433:5432"
    volumes:
      - commb_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commb_user} -d ${POSTGRES_DB:-commb_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  commb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${COMMB_PORT:-8422}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-commb_user}:${POSTGRES_PASSWORD:-commb_dev_pass}@postgres:5432/${POSTGRES_DB:-commb_dev}"
    volumes:
      # Hot-reload: local source changes reflect without rebuilding the image.
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  commb_dev_pgdata:
