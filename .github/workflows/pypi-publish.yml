name: Publish Python Package to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build & Upload to PyPI
    runs-on: ubuntu-latest
    # Bind to a GitHub environment so the PyPI trusted publisher can be scoped
    # to it, and so releases can require a manual approval if you add one.
    environment:
      name: pypi
      url: https://pypi.org/p/commb
    permissions:
      # Mandatory for PyPI Trusted Publishing (OIDC). No API token is stored
      # anywhere: PyPI is configured to trust this repo + workflow directly.
      # Configure at https://pypi.org/manage/project/commb/settings/publishing/
      #   Owner: sannex-01 | Repo: commb
      #   Workflow: pypi-publish.yml | Environment: pypi
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Widget build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Widget Bundle
        run: |
          cd widget
          npm ci || npm install
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution packages (wheel & sdist)
        run: |
          python -m build

      - name: Verify distribution metadata
        run: |
          python -m twine check dist/*

      # No `password:` — authentication happens over OIDC via the trusted
      # publisher configured on PyPI for this repo/workflow/environment.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
