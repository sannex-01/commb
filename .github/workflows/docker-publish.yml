# SECURITY: this repo is PUBLIC and this workflow runs on a SELF-HOSTED
# runner, i.e. on hardware we own, as our own user.
#
# That combination is only safe because the triggers below are `push` and
# `workflow_dispatch` -- both of which require write access to THIS repo. A
# fork cannot fire them.
#
# Do NOT add `pull_request` here. On a public repo that would let anyone run
# arbitrary code on the runner by opening a PR, with our filesystem, Docker
# daemon and any local .env in reach. If PR-triggered CI is ever needed, run
# it on a GitHub-hosted runner (`runs-on: ubuntu-latest`) instead.
name: Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/commb', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A local cache dir, not type=gha: the Actions cache service is not
          # available to a self-hosted runner, so type=gha would silently
          # cache nothing and every build would start from scratch.
          cache-from: type=local,src=/tmp/.buildx-cache-commb
          cache-to: type=local,dest=/tmp/.buildx-cache-commb-new,mode=max

      # Without this the cache directory grows without bound, since BuildKit
      # only ever appends to it.
      - name: Rotate the build cache
        run: |
          rm -rf /tmp/.buildx-cache-commb
          mv /tmp/.buildx-cache-commb-new /tmp/.buildx-cache-commb
