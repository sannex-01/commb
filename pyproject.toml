[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commb"
version = "0.2.0"
description = "CommB (Commercial Bots) — Open-Source AI Commerce Bots & Omnichannel Customer Service Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Sannex Tech LTD", email = "info@sannex.ng" },
]
keywords = [
    "ai",
    "chatbot",
    "commerce",
    "whatsapp",
    "telegram",
    "commb",
    "fastapi",
    "customer-service",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "cryptography>=43.0.0",
    "apscheduler>=3.10.4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# Optional CommB Cloud sync. NOT needed for release notes or the sponsor
# banner — those use a keyless public fetch built on httpx, which is already a
# hard dependency, so every install gets update and security notices.
#
# Install `commb[cloud]` ONLY to connect an instance to a CommB Cloud
# workspace. Doing so exports personal data (customer profiles, addresses,
# orders, conversation transcripts). A self-hosted CommB never phones home.
cloud = [
    "commb-agent>=0.3.0",
]
# Deprecated alias for `cloud`; kept so existing installs keep resolving.
telemetry = [
    "commb-agent>=0.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.2.0",
    "twine>=5.1.0",
]

[project.scripts]
commb = "app.cli:main"

[project.urls]
Homepage = "https://commb.app"
Documentation = "https://docs.commb.app"
Repository = "https://github.com/sannex-01/commb"
Issues = "https://github.com/sannex-01/commb/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "widget*"]
# Without this, `widget*` also matches widget.node_modules.* and the entire
# JS build toolchain (typescript, vite, rollup, ...) gets published inside the
# wheel. Only the built bundle in widget/dist is meant to ship.
exclude = ["widget.node_modules*", "widget.src*", "tests*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.png", "*.svg", "*.ico"]
# JS/JSON are listed per-package rather than globally, so a stray dependency
# tree can never sweep its own files into the distribution.
"app" = ["**/*.js", "**/*.json"]
"widget" = ["dist/widget.js"]
